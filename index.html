<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign-up form</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="side-content">
      <div class="odin-logo">
        <img src="./resources/odin-lined.png" alt="odin-project-logo" />
        <h1 class="logo-text">ODIN</h1>
      </div>
      <div class="copyright">
        <p>Photo by Halie West on Unsplash</p>
      </div>
    </div>
    <div class="main-content">
      <div class="main-text">
        <p>
          This is not a real online service! You know you need something like
          this in your life to help you realize your deepest dreams. Sign up
          <em>now</em> to get started.
        </p>
        <p>You <em>know</em> you want to.</p>
      </div>
      <form action="#" method="post" id="sign-up">
        <fieldset>
          <legend>Let's do this!</legend>
          <div class="row">
            <div class="input">
              <label for="first-name">First name</label>
              <input type="text" name="first-name" id="first-name" />
            </div>

            <div class="input">
              <label for="last-name">Last name</label>
              <input type="text" name="last-name" id="last-name" />
            </div>
          </div>

          <div class="row">
            <div class="input">
              <label for="email">Email</label>
              <input type="email" name="email" id="email" />
            </div>

            <div class="input">
              <label for="phone-number">Phone number</label>
              <input type="text" name="phone-number" id="phone-number" />
            </div>
          </div>

          <div class="row">
            <div class="input">
              <label for="password">Password</label>
              <input
                type="password"
                name="password"
                id="password"
                minlength="8"
                required
              />
            </div>

            <div class="input">
              <label for="confirm-password">Confirm password</label>
              <input
                type="password"
                name="confirm-password"
                id="confirm-password"
                minlength="8"
                required
              />
            </div>
          </div>
        </fieldset>
      </form>

      <button type="submit" form="sign-up">Create account</button>
      <p>Already have and account? <a href="#">Log in</a></p>
    </div>
  </body>
</html>
